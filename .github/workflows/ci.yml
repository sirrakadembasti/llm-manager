name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Verify package bundle contents
        shell: bash
        run: |
          tarball_files=$(npm pack --dry-run 2>&1)
          if echo "$tarball_files" | grep -E "tests/|data/|\.env$"; then
            echo "Error: Forbidden files included in npm package bundle!"
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify dependency registry signatures
        run: npm audit signatures

      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x') }}
        run: npm test

      # One matrix entry enforces the line/branch thresholds from package.json
      # (80% / 70%); coverage runs the same full suite.
      - name: Run tests with coverage thresholds
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x' }}
        run: npm run test:coverage
