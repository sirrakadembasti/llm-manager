name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Verify package bundle contents
        shell: bash
        run: |
          tarball_files=$(npm pack --dry-run 2>&1)
          if echo "$tarball_files" | grep -E "tests/|data/|\.env$"; then
            echo "Error: Forbidden files included in npm package bundle!"
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run tests
        run: npm test
